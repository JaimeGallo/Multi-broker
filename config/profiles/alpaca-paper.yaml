# Phase 4: paper trading in real time. Alpaca PAPER account (no money moves) + live Alpaca market data.
# Keys: APCA_API_KEY_ID / APCA_API_SECRET_KEY in .env (the same paper keys used for the downloads).
#   python -m apps.trading_engine --config config/profiles/alpaca-paper.yaml run
#   python -m apps.trading_engine --config config/profiles/alpaca-paper.yaml run --minutes 30
# Run it on a computer that stays on from 09:30 to 16:00 New York time; Ctrl+C stops safely.
trading:
  mode: paper
  symbols: [SPY, QQQ, IWM, AAPL, MSFT, NVDA, AMZN, META, JPM, XOM]
  timeframe: 1Min
  decision_timeframe: 1Min
  horizon_minutes: 15

market_data:
  provider: alpaca
  alpaca:
    feed: iex                   # free on the Basic plan (one exchange); sip needs Algo Trader Plus (USD 99/month)

broker:
  mode: paper
  active: alpaca
  mock:
    enabled: false
  alpaca:
    enabled: true
    paper: true

data_quality:
  # IEX publishes no bar for a minute without IEX trades. Missing minutes are first re-requested by REST; a
  # single minute still missing is "no trade on IEX", not a feed fault, so it does not block the next 15 bars.
  ignore_gaps_up_to_bars: 1

model:
  name: jev-heuristic           # no validated edge: this run tests the machinery, not profitability

risk:
  allow_short: true

logging:
  level: WARNING
