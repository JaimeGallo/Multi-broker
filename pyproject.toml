[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trading"
version = "0.1.0"
description = "JEV real-time multi-broker trading engine (backtest/paper only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
# Planned phases (not required yet):
#   alpaca  = ["alpaca-py"]              Phase 4
#   api     = ["fastapi", "uvicorn"]     Phase 5
#   ml      = ["scikit-learn", "joblib"] Phase 3
#   ibkr    = ["ib_async"]               Phase 8

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# E501: `ruff format` owns line length; it leaves long docstrings and literals alone on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["packages", "apps"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
