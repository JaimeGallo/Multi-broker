name: CI

# Lint, types, tests, image build and dependency audit. This workflow never deploys and never touches a broker:
# every test runs offline on synthetic data with the mock broker.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,typesafe]"
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the typesafe extra lets the adapter test check the official SDK wire format (no network calls)
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,typesafe]"
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/trading-engine.Dockerfile -t jev-trading-engine:ci .
      - name: Smoke test (help + refusal of live mode)
        run: |
          docker run --rm jev-trading-engine:ci --help
          set +e
          docker run --rm -e JEV__TRADING__MODE=live jev-trading-engine:ci run
          code=$?
          set -e
          test "$code" -eq 2

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools && pip install -e ".[dev,postgres,typesafe]" pip-audit
      - run: pip-audit --skip-editable
