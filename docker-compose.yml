# Local stack: PostgreSQL (audit database), Redis (event bridge, phase 5) and the trading engine.
# Paper/backtest only. Usage:
#   cp .env.example .env            # set POSTGRES_PASSWORD; never commit .env
#   docker compose up --build       # runs a synthetic simulation against PostgreSQL
#   docker compose run --rm trading-engine verify --run-id <run_id>
name: jev-trading

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jev
      POSTGRES_DB: jev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  trading-engine:
    build:
      context: .
      dockerfile: infra/docker/trading-engine.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://jev:${POSTGRES_PASSWORD}@postgres:5432/jev
      JEV__LOGGING__LEVEL: WARNING
      LIVE_TRADING_ENABLED: "false"
    # `run` (paper trading against Alpaca) arrives in phase 4; until then the engine runs simulations.
    command: ["simulate", "--start", "2024-03-04", "--end", "2024-03-08"]

volumes:
  postgres-data:
